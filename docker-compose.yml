# dev: docker compose up -d --build

name: techx

services:
  nginx:
    build: ./nginx
    container_name: techx-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - api
      - web
    networks:
      - frontend
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: dev
    container_name: techx-web
    environment:
      NODE_ENV: development
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: dev
    container_name: techx-api
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # auth
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # mysql
      DATABASE_URL: mysql://${MYSQL_USER:-techx}:${MYSQL_PASSWORD:-techx_secret}@mysql:3306/${MYSQL_DATABASE:-techx}
      SHADOW_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root_secret}@mysql:3306/prisma_migrate_shadow
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techx}
      MYSQL_USER: ${MYSQL_USER:-techx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-techx_secret}
      # mongodb
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-root_secret}@mongo:27017/${MONGO_DATABASE:-techx_logs}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-techx_logs}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-60}
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    expose:
      - "3000"
    depends_on:
      - mysql
      - mongo
    networks:
      - frontend
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: techx-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techx}
      MYSQL_USER: ${MYSQL_USER:-techx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-techx_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    networks:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: techx-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-techx_logs}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  web_node_modules:
  api_node_modules:
