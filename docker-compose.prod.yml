# prod: docker compose -f docker-compose.prod.yml up -d --build

name: techx-prod

services:
  nginx:
    build: ./nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - api
      - web
    networks:
      - frontend
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: prod
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: prod
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # auth — sem default: em produção o segredo é obrigatório
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # mysql
      DATABASE_URL: mysql://${MYSQL_USER:-techx}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-techx}?allowPublicKeyRetrieval=true
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techx}
      MYSQL_USER: ${MYSQL_USER:-techx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # mongodb
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-techx_logs}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-techx_logs}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-60}
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_started
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # one-shot: aplica as migrations antes de a API subir e encerra.
  # usa o stage `build`, que é o único com o CLI do Prisma e a pasta prisma/ —
  # a imagem de produção roda com --omit=dev e não os tem.
  migrate:
    build:
      context: ./api
      target: build
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-techx}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-techx}?allowPublicKeyRetrieval=true
      # o prisma.config.ts resolve esta de forma eager, mesmo sem usá-la aqui
      SHADOW_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/prisma_migrate_shadow
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techx}
      MYSQL_USER: ${MYSQL_USER:-techx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-techx_logs}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
