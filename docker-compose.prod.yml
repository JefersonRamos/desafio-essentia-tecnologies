# Hello World
# prod: docker compose -f docker-compose.prod.yml up -d --build

name: techx-prod

services:
  nginx:
    build: ./nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - api
      - web
    networks:
      - frontend
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: prod
    expose:
      - "80"
    networks:
      - frontend
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: prod
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      # mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techx}
      MYSQL_USER: ${MYSQL_USER:-techx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # mongodb
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-techx_logs}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-techx_logs}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-60}
    expose:
      - "3000"
    depends_on:
      - mysql
      - mongo
    networks:
      - frontend
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techx}
      MYSQL_USER: ${MYSQL_USER:-techx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-techx_logs}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
