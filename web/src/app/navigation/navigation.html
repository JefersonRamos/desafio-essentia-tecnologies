<aside class="w-[68px] flex-none py-4 pl-3.5">
  <div
    class="sticky top-4 flex flex-col items-center gap-2.5 rounded-rail border border-line bg-surface px-2.5 py-3 shadow-rail"
  >

    <nav class="flex flex-col gap-1.5">
      <button
        type="button"
        title="Visão geral"
        aria-label="Visão geral"
        aria-current="page"
        class="grid size-10 cursor-pointer place-items-center rounded-control border border-ink bg-ink text-[18px] text-surface"
      >
        <i class="fa-solid fa-table-cells-large"></i>
      </button>

      <button
        type="button"
        title="Tarefas"
        aria-label="Tarefas"
        class="grid size-10 cursor-pointer place-items-center rounded-control border border-line bg-surface text-[18px] text-tertiary hover:bg-surface-hover"
      >
        <i class="fa-solid fa-list-check"></i>
      </button>
    </nav>

    <div class="h-px w-[22px] bg-line"></div>

    <button
      type="button"
      title="Conta"
      aria-label="Conta"
      aria-expanded="false"
      class="grid size-10 cursor-pointer place-items-center rounded-control border border-line bg-surface p-0 hover:bg-surface-hover"
    >
      <span
        class="grid size-[26px] place-items-center rounded-full bg-linear-[135deg] from-accent to-coral"
      >
        <i class="fa-solid fa-user text-[14px] text-surface"></i>
      </span>
    </button>
  </div>
</aside>
