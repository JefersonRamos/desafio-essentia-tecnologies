# Angular prod

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # assets com hash no nome podem ser cacheados agressivamente
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # rotas do Angular (deep links) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
